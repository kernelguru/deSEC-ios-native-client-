name: Build unsigned IPA

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode auswählen
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Xcode-Projekt erzeugen
        run: xcodegen generate

      - name: Bauen (ohne Signatur)
        run: |
          xcodebuild -quiet \
            -project DesecClient.xcodeproj \
            -scheme DesecClient \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: IPA verpacken
        run: |
          APP=build/Build/Products/Release-iphoneos/DesecClient.app
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry DesecClient-unsigned.ipa Payload

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: DesecClient-unsigned-ipa
          path: DesecClient-unsigned.ipa
          retention-days: 30
